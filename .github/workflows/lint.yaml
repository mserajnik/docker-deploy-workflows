name: Lint

on:
  push:
    branches:
      - master
  pull_request:

env:
  UV_FROZEN: "1"

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: kjanat/actionlint@v1

  ruff:
    name: Ruff
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format
        run: uv run ruff format --check

  ty:
    name: ty
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run ty check
        run: uv run ty check

  pytest:
    name: pytest
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run pytest
        run: uv run pytest

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run reuse lint
        uses: fsfe/reuse-action@v6

  dprint:
    name: dprint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run dprint check
        uses: dprint/check@v2.5
